name: ESPN sync

# Credential-check + sync job for data, scoring, and matchups (see
# AGENTS.md and ROADMAP.md Phase 2.3). Runs here instead of a Vercel Cron
# Route Handler because the site is a static export with no server
# runtime — see scripts/sync-espn.mjs.
#
# Target: Fridays 6:00 AM, Mondays 1:00 AM, and Tuesdays 1:00 AM, all US
# Eastern (per AGENTS.md's US Eastern / NFL scheduling convention) — one
# pull after Thursday/Monday/Sunday-night games finish scoring and one
# ahead of the weekend slate. GitHub Actions cron is UTC-only and doesn't
# observe DST, so each target time is scheduled twice (EDT and EST UTC
# offsets); the "Skip the inactive DST offset" step below no-ops whichever
# entry isn't the one for the currently-active US Eastern offset.
#
# That guard identifies itself by `github.event.schedule` (the exact cron
# string that fired), NOT by checking the current wall-clock hour — GitHub
# Actions scheduled runs have been observed starting 4-7+ hours late (see
# the "ESPN sync" run history), which made an hour-exact check fail on
# every single scheduled run. DST-zone matching only cares whether it's
# currently EDT or EST, which a multi-hour start delay doesn't change.

on:
  schedule:
    - cron: "0 10 * * 5"  # 6am EDT Fri (UTC-4) -> 10:00 UTC Fri
    - cron: "0 11 * * 5"  # 6am EST Fri (UTC-5) -> 11:00 UTC Fri
    - cron: "0 5 * * 1"   # 1am EDT Mon (UTC-4) -> 05:00 UTC Mon
    - cron: "0 6 * * 1"   # 1am EST Mon (UTC-5) -> 06:00 UTC Mon
    - cron: "0 5 * * 2"   # 1am EDT Tue (UTC-4) -> 05:00 UTC Tue
    - cron: "0 6 * * 2"   # 1am EST Tue (UTC-5) -> 06:00 UTC Tue
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SKIP: 'false'
    steps:
      - name: Skip the inactive DST offset
        if: github.event_name == 'schedule'
        run: |
          zone="$(TZ=America/New_York date +%Z)"  # EDT or EST, whatever time this actually runs at
          case "${{ github.event.schedule }}" in
            "0 10 * * 5") expected=EDT ;;  # 6am EDT Fri
            "0 11 * * 5") expected=EST ;;  # 6am EST Fri
            "0 5 * * 1")  expected=EDT ;;  # 1am EDT Mon
            "0 6 * * 1")  expected=EST ;;  # 1am EST Mon
            "0 5 * * 2")  expected=EDT ;;  # 1am EDT Tue
            "0 6 * * 2")  expected=EST ;;  # 1am EST Tue
            *) expected="$zone" ;;  # unrecognized cron string -- run rather than silently drop a sync
          esac
          if [ "$zone" != "$expected" ]; then
            echo "Currently $zone; schedule '${{ github.event.schedule }}' is the $expected entry — skipping (this is the other DST offset's entry)."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != 'true'

      - uses: pnpm/action-setup@v4
        if: env.SKIP != 'true'

      - uses: actions/setup-node@v4
        if: env.SKIP != 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: env.SKIP != 'true'

      - run: node scripts/sync-espn.mjs
        if: env.SKIP != 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ESPN_LEAGUE_ID: ${{ vars.ESPN_LEAGUE_ID }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}

      - run: node scripts/compute-records.mjs
        if: env.SKIP != 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # These two are mutually exclusive per run (success() and failure()
      # can't both be true) and independent of GitHub's personal
      # notification settings, so together they're the reliable way to
      # know whether a scheduled sync went through. Both no-op (silently
      # skipped, not a failure) if the DISCORD_UPDATES repo secret (a
      # Discord channel webhook URL) isn't configured. The success one
      # also skips on the inactive-DST-offset run (env.SKIP == 'true')
      # that did nothing — only the failure one should ever fire for that
      # case, and even then only if something upstream (e.g. the Skip
      # step itself) errored.
      - name: Notify Discord on success
        if: success() && env.SKIP != 'true'
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_UPDATES secret not set — skipping Discord notification."
            exit 0
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload=$(jq -n --arg content "✅ **ESPN sync succeeded** — $run_url" '{content: $content}')
          curl -sf -X POST -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES }}

      # Fires on any prior step failure (credential check, install, or the
      # sync script itself exiting non-zero).
      - name: Notify Discord on failure
        if: failure()
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_UPDATES secret not set — skipping Discord notification."
            exit 0
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload=$(jq -n --arg content "⚠️ **ESPN sync failed** — $run_url" '{content: $content}')
          curl -sf -X POST -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES }}
