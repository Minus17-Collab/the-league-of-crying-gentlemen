name: ESPN sync

# Credential-check + sync job for data, scoring, and matchups (see
# AGENTS.md and ROADMAP.md Phase 2.3). Runs here instead of a Vercel Cron
# Route Handler because the site is a static export with no server
# runtime — see scripts/sync-espn.mjs.
#
# Target: Fridays 6:00 AM, Mondays 1:00 AM, and Tuesdays 1:00 AM, all US
# Eastern (per AGENTS.md's US Eastern / NFL scheduling convention) — one
# pull after Thursday/Monday/Sunday-night games finish scoring and one
# ahead of the weekend slate. GitHub Actions cron is UTC-only and doesn't
# observe DST, so each target time is scheduled twice (EDT and EST UTC
# offsets); the "Skip if not a scheduled Eastern time" step below no-ops
# whichever run doesn't actually land on one of the three ET slots.

on:
  schedule:
    - cron: "0 10 * * 5"  # 6am EDT Fri (UTC-4) -> 10:00 UTC Fri
    - cron: "0 11 * * 5"  # 6am EST Fri (UTC-5) -> 11:00 UTC Fri
    - cron: "0 5 * * 1"   # 1am EDT Mon (UTC-4) -> 05:00 UTC Mon
    - cron: "0 6 * * 1"   # 1am EST Mon (UTC-5) -> 06:00 UTC Mon
    - cron: "0 5 * * 2"   # 1am EDT Tue (UTC-4) -> 05:00 UTC Tue
    - cron: "0 6 * * 2"   # 1am EST Tue (UTC-5) -> 06:00 UTC Tue
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if not a scheduled Eastern time
        if: github.event_name == 'schedule'
        run: |
          day="$(TZ=America/New_York date +%u)"   # 1=Mon .. 5=Fri .. 7=Sun
          hour="$(TZ=America/New_York date +%H)"
          run=false
          [ "$day" = "5" ] && [ "$hour" = "06" ] && run=true  # Fri 6am ET
          [ "$day" = "1" ] && [ "$hour" = "01" ] && run=true  # Mon 1am ET
          [ "$day" = "2" ] && [ "$hour" = "01" ] && run=true  # Tue 1am ET
          if [ "$run" != "true" ]; then
            echo "Current Eastern time is day $day hour $hour, not a scheduled slot — skipping (this is the other DST offset's run)."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != 'true'

      - uses: pnpm/action-setup@v4
        if: env.SKIP != 'true'

      - uses: actions/setup-node@v4
        if: env.SKIP != 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: env.SKIP != 'true'

      - run: node scripts/sync-espn.mjs
        if: env.SKIP != 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ESPN_LEAGUE_ID: ${{ vars.ESPN_LEAGUE_ID }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}

      # Fires on any prior step failure (credential check, install, or the
      # sync script itself exiting non-zero) — independent of GitHub's
      # personal notification settings, so it's the reliable way to know
      # a scheduled sync didn't go through. No-op (silently skipped) if
      # DISCORD_WEBHOOK_URL isn't configured as a repo secret.
      - name: Notify Discord on failure
        if: failure()
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set — skipping Discord notification."
            exit 0
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload=$(jq -n --arg content "⚠️ **ESPN sync failed** — $run_url" '{content: $content}')
          curl -sf -X POST -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
