# Supabase CLI config. Run `supabase login` then `supabase link
# --project-ref <ref>` once the project exists (see RUNBOOK.md).
project_id = "ffl-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
# Magic link only — see AGENTS.md "Auth model". No password flows.

[storage]
enabled = false
